<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" role="img" aria-label="Abstract solar panel grid">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1F3A"/>
      <stop offset="100%" stop-color="#16315E"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="#FAFAF7"/>
  <g transform="translate(60 80) rotate(-8 240 240)">
    <g>
      <g>
        <rect x="0" y="0" width="100" height="60" fill="url(#panel)"/>
        <line x1="50" y1="0" x2="50" y2="60" stroke="#FAFAF7" stroke-width="1"/>
        <line x1="0" y1="20" x2="100" y2="20" stroke="#FAFAF7" stroke-width="0.5"/>
        <line x1="0" y1="40" x2="100" y2="40" stroke="#FAFAF7" stroke-width="0.5"/>
      </g>
      <g transform="translate(120 0)">
        <rect width="100" height="60" fill="url(#panel)"/>
        <line x1="50" y1="0" x2="50" y2="60" stroke="#FAFAF7" stroke-width="1"/>
        <line x1="0" y1="20" x2="100" y2="20" stroke="#FAFAF7" stroke-width="0.5"/>
        <line x1="0" y1="40" x2="100" y2="40" stroke="#FAFAF7" stroke-width="0.5"/>
      </g>
      <g transform="translate(240 0)">
        <rect width="100" height="60" fill="url(#panel)"/>
        <line x1="50" y1="0" x2="50" y2="60" stroke="#FAFAF7" stroke-width="1"/>
        <line x1="0" y1="20" x2="100" y2="20" stroke="#FAFAF7" stroke-width="0.5"/>
        <line x1="0" y1="40" x2="100" y2="40" stroke="#FAFAF7" stroke-width="0.5"/>
      </g>
      <g transform="translate(360 0)">
        <rect width="100" height="60" fill="url(#panel)"/>
        <line x1="50" y1="0" x2="50" y2="60" stroke="#FAFAF7" stroke-width="1"/>
        <line x1="0" y1="20" x2="100" y2="20" stroke="#FAFAF7" stroke-width="0.5"/>
        <line x1="0" y1="40" x2="100" y2="40" stroke="#FAFAF7" stroke-width="0.5"/>
      </g>
    </g>
    <g transform="translate(0 80)">
      <rect width="100" height="60" fill="url(#panel)"/>
      <line x1="50" y1="0" x2="50" y2="60" stroke="#FAFAF7" stroke-width="1"/>
      <rect x="120" width="100" height="60" fill="url(#panel)"/>
      <line x1="170" y1="0" x2="170" y2="60" stroke="#FAFAF7" stroke-width="1"/>
      <rect x="240" width="100" height="60" fill="url(#panel)"/>
      <line x1="290" y1="0" x2="290" y2="60" stroke="#FAFAF7" stroke-width="1"/>
      <rect x="360" width="100" height="60" fill="url(#panel)"/>
      <line x1="410" y1="0" x2="410" y2="60" stroke="#FAFAF7" stroke-width="1"/>
    </g>
    <g transform="translate(0 160)">
      <rect width="100" height="60" fill="url(#panel)"/>
      <rect x="120" width="100" height="60" fill="url(#panel)"/>
      <rect x="240" width="100" height="60" fill="url(#panel)"/>
      <rect x="360" width="100" height="60" fill="url(#panel)"/>
    </g>
    <g transform="translate(0 240)">
      <rect width="100" height="60" fill="url(#panel)" opacity="0.85"/>
      <rect x="120" width="100" height="60" fill="url(#panel)" opacity="0.85"/>
      <rect x="240" width="100" height="60" fill="url(#panel)" opacity="0.85"/>
      <rect x="360" width="100" height="60" fill="url(#panel)" opacity="0.85"/>
